<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASL A–Z Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-DixLgzZj.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-_jCGIaWW.css">
</head>
<body>
  <div id="app-loading">
    <div class="asl-loading__spinner"></div>
    <h2>Loading ASL Learning...</h2>
    <div class="asl-loading__steps">
      <div class="asl-loading__step" id="load-tf-container">
        <div class="asl-loading__step-icon asl-loading__step--loading" id="load-tf"></div>
        <span>TensorFlow.js</span>
      </div>
      <div class="asl-loading__step" id="load-mp-container">
        <div class="asl-loading__step-icon asl-loading__step--loading" id="load-mp"></div>
        <span>MediaPipe</span>
      </div>
      <div class="asl-loading__step" id="load-model-container">
        <div class="asl-loading__step-icon asl-loading__step--loading" id="load-model"></div>
        <span>ASL Model</span>
      </div>
    </div>
    <div id="load-error" style="display: none;"></div>
  </div>

  <div id="app" style="display:none">
    <nav id="navbar"></nav>
    <main id="page-content"></main>
    <div id="debug-panel"></div>
  </div>

</body>
</html>
